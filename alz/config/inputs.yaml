---
iac_type: "terraform"
bootstrap_module_name: "alz_local"
starter_module_name: "platform_landing_zone"

bootstrap_location: "belgiumcentral"
bootstrap_subscription_id: ""
# Empty selects the explicitly supplied tenant's root management group.
root_parent_management_group_id: ""
# Populated by Initialize-Alz.ps1 from parameters or ARM_SUBSCRIPTION_ID.
subscription_ids:
  management: ""
  connectivity: ""

service_name: "alz"
environment_name: "demo"
postfix_number: 1
create_bootstrap_resources_in_azure: true
# Subscription placement is owned by the landing zone, not bootstrap.
move_subscriptions_to_target_management_group: false
storage_account_replication_type: "LRS"
target_directory: ""
