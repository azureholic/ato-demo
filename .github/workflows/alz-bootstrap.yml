name: Bootstrap ALZ Terraform SMB

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BOOTSTRAP to authorize Azure bootstrap resources and RBAC changes (not landing zone deployment)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: alz-demo-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirmation == 'BOOTSTRAP'
    runs-on: [self-hosted, Windows, X64, alz]
    environment: demo
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      ALZ_OUTPUT_PATH: ${{ vars.ALZ_OUTPUT_PATH }}
      SECURITY_CONTACT_EMAIL: ${{ vars.ALZ_SECURITY_CONTACT_EMAIL }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check prerequisites and persistent output
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'ALZ_OUTPUT_PATH', 'SECURITY_CONTACT_EMAIL', 'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub environment variable: $name. See alz\README.md."
            }
          }
          if (-not [IO.Path]::IsPathFullyQualified($env:ALZ_OUTPUT_PATH)) {
            throw 'ALZ_OUTPUT_PATH must be an absolute persistent directory on the runner.'
          }
          $output = [IO.Path]::GetFullPath($env:ALZ_OUTPUT_PATH).TrimEnd('\')
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          foreach ($ephemeral in @($workspace, $temp)) {
            if ($output -eq $ephemeral -or $output.StartsWith("$ephemeral\", [StringComparison]::OrdinalIgnoreCase)) {
              throw 'ALZ_OUTPUT_PATH must be outside the checkout and runner temporary directory to retain bootstrap state.'
            }
          }
          Import-Module ALZ -RequiredVersion 7.1.5 -ErrorAction Stop
          Import-Module powershell-yaml -ErrorAction Stop
          foreach ($command in 'az', 'terraform', 'git') {
            Get-Command $command -ErrorAction Stop | Out-Null
          }

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap to persistent local folder
        run: |
          .\alz\scripts\Initialize-Alz.ps1 `
            -SecurityContactEmail $env:SECURITY_CONTACT_EMAIL `
            -OutputPath $env:ALZ_OUTPUT_PATH `
            -Bootstrap
