name: Deploy ALZ Platform (Bicep Accelerator)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: alz-demo-platform
  cancel-in-progress: false

jobs:
  deploy:
    name: Generate and deploy SMB platform (approval required)
    runs-on: windows-latest
    environment: demo
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment approval gate and settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run this workflow from main only.'
          }
          foreach ($name in 'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing demo environment variable: $name."
            }
          }
          $environmentJson = & gh api "repos/$env:GITHUB_REPOSITORY/environments/demo"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the demo deployment approval gate.' }
          $deploymentEnvironment = $environmentJson | ConvertFrom-Json
          $reviewerRules = @($deploymentEnvironment.protection_rules | Where-Object {
            $_.type -eq 'required_reviewers' -and @($_.reviewers).Count -gt 0
          })
          if ($reviewerRules.Count -eq 0) {
            throw 'Configure required reviewers on demo before running this workflow.'
          }

      - name: Install Terraform (local file generation only)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Install ALZ PowerShell dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-ModuleWithRetry {
            param([string]$Name, [string]$RequiredVersion)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Installing $Name $RequiredVersion (attempt $attempt/5)..."
              try {
                Install-Module -Name $Name -RequiredVersion $RequiredVersion -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
                return
              } catch {
                if ($attempt -eq 5) {
                  throw "Failed to install $Name $RequiredVersion after 5 attempts: $($_.Exception.Message)"
                }
                $delaySeconds = [int](10 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Install failed for $Name ${RequiredVersion}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }
          }
          Install-ModuleWithRetry -Name powershell-yaml -RequiredVersion 0.4.12
          Install-ModuleWithRetry -Name ALZ -RequiredVersion 7.1.5
          Install-ModuleWithRetry -Name Az.Accounts -RequiredVersion 5.5.4
          Install-ModuleWithRetry -Name Az.Resources -RequiredVersion 10.2.2

      - name: Install Bicep CLI
        run: |
          $ErrorActionPreference = 'Stop'
          az bicep install
          if ($LASTEXITCODE -ne 0) { throw 'Bicep CLI installation failed.' }
          Join-Path $HOME '.azure\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Test platform deployment and DNS adapters
        run: .\platform-alz\tests\Test-PlatformAlz.ps1

      - name: Compile shared platform DNS before deployment
        run: .\platform-alz\Invoke-PlatformDns.ps1 -OutputPath "$env:RUNNER_TEMP\platform-dns" -ValidateOnly

      - name: Generate from repository configuration and run official local deployment
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ALZ -RequiredVersion 7.1.5
          .\platform-alz\Invoke-PlatformAlz.ps1 -OutputPath "$env:RUNNER_TEMP\platform-alz" -RefreshGitHubOidc

      - name: Refresh Azure CLI login for shared platform DNS
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision shared platform DNS
        run: .\platform-alz\Invoke-PlatformDns.ps1 -OutputPath "$env:RUNNER_TEMP\platform-dns"

      - name: Provision scoped agent and private runner firewall egress
        run: |
          $config = Get-Content '.\platform-alz\config\workload-egress.json' -Raw | ConvertFrom-Json
          az deployment group create --subscription $config.subscriptionId `
            --resource-group $config.resourceGroupName --name ai-agent-and-private-runner-egress `
            --template-file '.\platform-alz\config\workload-egress.bicep' --mode Incremental --output none
          if ($LASTEXITCODE -ne 0) { throw 'Workload firewall egress deployment failed.' }
